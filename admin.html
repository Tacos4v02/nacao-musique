<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Barlow',sans-serif; background:#f5f5f5; color:#1a1a1a; min-height:100vh; }

  /* LOGIN */
  .login-screen {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0a1a3d;
  }
  .login-box {
    background:#fff;
    border-radius:12px;
    padding:2.5rem;
    width:100%;
    max-width:360px;
    text-align:center;
  }
  .login-box h1 {
    font-family:'Bebas Neue',cursive;
    font-size:2rem;
    color:#0a1a3d;
    letter-spacing:2px;
    margin-bottom:0.25rem;
  }
  .login-box p { color:#666; font-size:0.9rem; margin-bottom:1.5rem; }
  .login-box input {
    width:100%;
    padding:0.75rem 1rem;
    border:1.5px solid #ddd;
    border-radius:8px;
    font-size:1rem;
    margin-bottom:1rem;
    outline:none;
    font-family:'Barlow',sans-serif;
  }
  .login-box input:focus { border-color:#0a1a3d; }
  .login-error { color:#c0392b; font-size:0.85rem; margin-bottom:0.75rem; display:none; }

  /* ADMIN */
  .admin-screen { display:none; }
  nav {
    background:#0a1a3d;
    padding:0 2rem;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  nav span {
    font-family:'Bebas Neue',cursive;
    font-size:1.4rem;
    color:#f0c040;
    letter-spacing:2px;
  }
  nav button {
    background: none;
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 0.4rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Barlow', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
  }
  nav button:hover { border-color: #f0c040; color: #f0c040; }

  .admin-content {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem;
  }
  .section-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 2rem;
    color: #0a1a3d;
    letter-spacing: 2px;
    border-left: 5px solid #f0c040;
    padding-left: 1rem;
    margin-bottom: 2rem;
  }

  /* FORMULAIRE */
  .form-card {
    background: #fff;
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 2rem;
    border: 1px solid #e0e0e0;
  }
  .form-card h2 {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.4rem;
    color: #0a1a3d;
    letter-spacing: 1px;
    margin-bottom: 1.5rem;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .form-group.full { grid-column: 1 / -1; }
  label {
    font-size: 0.82rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #444;
  }
  input, select, textarea {
    padding: 0.65rem 1rem;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
    color: #1a1a1a;
  }
  input:focus, select:focus, textarea:focus { border-color: #0a1a3d; }
  textarea { resize: vertical; min-height: 140px; }
  .btn-submit {
    background: #f0c040;
    color: #0a1a3d;
    border: none;
    padding: 0.75rem 2rem;
    border-radius: 8px;
    font-family: 'Barlow', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s;
    margin-top: 0.5rem;
  }
  .btn-submit:hover { transform: translateY(-2px); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .form-success {
    color: #2d7a3e;
    font-weight: 600;
    font-size: 0.9rem;
    margin-top: 0.75rem;
    display: none;
  }
  .form-error {
    color: #c0392b;
    font-weight: 600;
    font-size: 0.9rem;
    margin-top: 0.75rem;
    display: none;
  }

  /* LISTE */
  .songs-list { display: flex; flex-direction: column; gap: 0.75rem; }
  .song-row {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .song-row-info { flex: 1; }
  .song-row-info strong { display: block; font-size: 0.95rem; }
  .song-row-info span { font-size: 0.8rem; color: #666; }
  .genre-tag {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
    flex-shrink: 0;
  }
  .tag-angola { background: #fff3e0; color: #bf5100; }
  .tag-regional { background: #e3f2fd; color: #0d47a1; }
  .tag-ladainha { background: #e8f5e9; color: #1b5e20; }
  .btn-delete {
    background: none;
    border: 1.5px solid #e0e0e0;
    color: #c0392b;
    padding: 0.4rem 0.85rem;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .btn-delete:hover { background: #fde8e8; border-color: #c0392b; }
  .empty { text-align: center; color: #999; padding: 2rem; font-size: 0.9rem; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>Nação Admin</h1>
    <p>Accès réservé aux administrateurs</p>
    <input type="password" id="password-input" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')login()">
    <div class="login-error" id="login-error">Mot de passe incorrect.</div>
    <button class="btn-submit" onclick="login()">Entrer</button>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-screen" id="admin-screen">
  <nav>
    <span>Nação Admin</span>
    <button onclick="logout()">Déconnexion</button>
  </nav>

  <div class="admin-content">
    <div class="section-title">Ajouter une musique</div>

    <div class="form-card">
      <h2>Nouvelle musique</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Titre</label>
          <input type="text" id="f-title" placeholder="Ex: Paranauê">
        </div>
        <div class="form-group">
          <label>Genre</label>
          <select id="f-genre">
            <option value="angola">Angola</option>
            <option value="regional">Regional</option>
            <option value="ladainha">Ladainha</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>Description (artiste, style...)</label>
          <input type="text" id="f-meta" placeholder="Ex: Corrido – Mestre Bimba">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>Lien vidéo YouTube (optionnel)</label>
          <input type="text" id="f-video" placeholder="https://www.youtube.com/watch?v=...">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>Paroles (Portugais)</label>
          <textarea id="f-lyrics" placeholder="Colle les paroles en portugais..."></textarea>
        </div>
        <div class="form-group full">
          <label>Traduction (Français)</label>
          <textarea id="f-translation" placeholder="Colle la traduction ligne par ligne..."></textarea>
        </div>
      </div>
      <button class="btn-submit" id="submit-btn" onclick="addSong()">Ajouter la musique</button>
      <div class="form-success" id="form-success">✓ Musique ajoutée avec succès !</div>
      <div class="form-error" id="form-error"></div>
    </div>

    <div class="section-title">Musiques existantes</div>
    <div class="songs-list" id="songs-list">
      <div class="empty">Chargement...</div>
    </div>
  </div>
</div>

<script>
  const MOT_DE_PASSE = 'nacao2025';

  function login() {
    const val = document.getElementById('password-input').value;
    if (val === MOT_DE_PASSE) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      loadSongs();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('password-input').value = '';
  }

  async function loadSongs() {
    const { data, error } = await db
      .from('songs')
      .select('*')
      .order('id', { ascending: false });

    const list = document.getElementById('songs-list');
    if (error || !data.length) {
      list.innerHTML = '<div class="empty">Aucune musique pour l\'instant.</div>';
      return;
    }
    list.innerHTML = data.map(s => {
      const tagClass = { angola: 'tag-angola', regional: 'tag-regional', ladainha: 'tag-ladainha' }[s.genre];
      const tagLabel = { angola: 'Angola', regional: 'Regional', ladainha: 'Ladainha' }[s.genre];
      return `
      <div class="song-row" id="row-${s.id}">
        <div class="song-row-info">
          <strong>${s.title}</strong>
          <span>${s.meta}</span>
        </div>
        <span class="genre-tag ${tagClass}">${tagLabel}</span>
        <button class="btn-delete" onclick="deleteSong(${s.id})">Supprimer</button>
      </div>`;
    }).join('');
  }

  async function addSong() {
    const title = document.getElementById('f-title').value.trim();
    const genre = document.getElementById('f-genre').value;
    const meta = document.getElementById('f-meta').value.trim();
    const lyrics = document.getElementById('f-lyrics').value.trim();
    const translation = document.getElementById('f-translation').value.trim();
    const video_url = document.getElementById('f-video').value.trim();

    const successEl = document.getElementById('form-success');
    const errorEl = document.getElementById('form-error');
    const btn = document.getElementById('submit-btn');

    successEl.style.display = 'none';
    errorEl.style.display = 'none';

    if (!title || !genre || !lyrics) {
      errorEl.textContent = 'Titre, genre et paroles sont obligatoires.';
      errorEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Ajout en cours...';

    const { data, error } = await db.from('songs').insert([{
      title, genre, meta, lyrics, translation: translation || null, video_url: video_url || null
    }], { returning: 'minimal' });
    console.log('data:', data);
    console.log('error:', error);

    btn.disabled = false;
    btn.textContent = 'Ajouter la musique';

    if (error) {
      errorEl.textContent = 'Erreur : ' + error.message;
      errorEl.style.display = 'block';
      return;
    }

    successEl.style.display = 'block';
    document.getElementById('f-title').value = '';
    document.getElementById('f-meta').value = '';
    document.getElementById('f-lyrics').value = '';
    document.getElementById('f-video').value = '';
    loadSongs();
  }

  async function deleteSong(id) {
    if (!confirm('Supprimer cette musique ?')) return;
    const { error } = await db.from('songs').delete().eq('id', id);
    if (!error) document.getElementById('row-' + id).remove();
  }
</script>
</body>
</html>
